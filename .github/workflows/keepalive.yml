# Free-tier Supabase projects pause after a week of inactivity. A cheap public GET every
# 3 days keeps the project awake. Only get-lot is called (public data, read-only).
name: keepalive

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping get-lot
        env:
          FUNCTIONS_URL: ${{ secrets.SUPABASE_FUNCTIONS_URL }}
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          LOT_SLUG: ${{ vars.LOT_SLUG }}
        run: |
          curl --fail --silent --show-error --max-time 20 --retry 2 \
            -H "apikey: ${ANON_KEY}" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            "${FUNCTIONS_URL}/get-lot?slug=${LOT_SLUG}" > /dev/null
